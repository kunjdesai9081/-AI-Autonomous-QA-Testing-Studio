[theme]
base = "dark"
primaryColor = "#6366F1"
backgroundColor = "#0A0D14"
secondaryBackgroundColor = "#111726"
textColor = "#F1F5F9"
font = "sans serif"

[client]
toolbarMode = "auto"
showErrorDetails = true

[server]
port = 8501
address = "0.0.0.0"
headless = true
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false
maxUploadSize = 200

[browser]
gatherUsageStats = false
